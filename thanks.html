  <h1>Thank you!</h1>

<script>
  // Reached only after FormSubmit accepted the booking. Tell the booking page (same origin).
  (function () {
    var ref = new URLSearchParams(location.search).get("ref") || "";
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: "mm-booking-ok", ref: ref }, location.origin); } catch (e) {}
    }
  })();
</script>
